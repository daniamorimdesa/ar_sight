name: ar_sight

description: "A new Flutter project."
version: 1.0.0+1


environment:
  sdk: ^3.10.7


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mobx: ^2.6.0
  flutter_mobx: ^2.3.0
  provider: ^6.1.5+1
  json_annotation: ^4.10.0
  window_manager: ^0.3.8
  path_provider: ^2.1.4
  flutter_svg: ^2.0.10
  flutter_launcher_icons: ^0.14.4
  dio: ^5.4.0
  camera: ^0.11.0
  lottie: ^3.0.0
  video_player: ^2.8.0
  google_fonts: ^6.1.0
  flutter_dotenv: ^5.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  mobx_codegen: ^2.7.6


flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo/ARSIGHT_logo.svg
    - assets/icon/icon1.png
    - assets/icon/icon2.png
    - assets/icon/icon3.png
    - assets/icon/icon3_rm_bg.png
    - assets/videos/ar_bg_1.mp4
    - assets/videos/ar_bg_2.mp4
    - assets/videos/ar_bg_3.mp4
    - assets/videos/ar_bg_4.mp4
    - assets/lottie/robot.json
    - assets/lottie/cat.json
    - assets/lottie/bear.json
    - assets/lottie/girl.json
    - assets/lottie/blackcat.json
    - assets/lottie/bluecat.json

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon3.png"